project_id = "mmemme"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]

[db]
port = 54322
major_version = 15

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[auth]
enabled = true
site_url = "mmemme://auth"

[auth.sms]
enable_signup = true
enable_confirmations = false

[auth.sms.test_otp]
2348012345678 = "123456"

# A provider must be enabled for GoTrue to expose phone auth locally. The
# pre-defined test number above is intercepted before any Twilio request.
[auth.sms.twilio]
enabled = true
account_sid = "AC00000000000000000000000000000000"
message_service_sid = "MG00000000000000000000000000000000"
auth_token = "env(SUPABASE_AUTH_SMS_TWILIO_AUTH_TOKEN)"

[functions.initialize-payment]
verify_jwt = true

[functions.paystack-webhook]
verify_jwt = false

[functions.process-refund]
verify_jwt = true

[functions.demo-confirm-payment]
verify_jwt = true

[functions.dispatch-notifications]
verify_jwt = false

[functions.scan-vendor-evidence]
verify_jwt = true

[functions.vendor-provider-check]
verify_jwt = true

[functions.reconcile-financials]
verify_jwt = false

[functions.security-maintenance]
verify_jwt = false
