name: Scheduled operations

on:
  schedule:
    - cron: "*/10 * * * *"
    - cron: "17 2 * * *"
    - cron: "43 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  notifications:
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '*/10 * * * *'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Dispatch notification outbox
        env:
          FUNCTIONS_URL: ${{ secrets.PRODUCTION_SUPABASE_FUNCTIONS_URL }}
          CRON_SECRET: ${{ secrets.PRODUCTION_CRON_SECRET }}
        run: curl --fail-with-body --retry 3 --retry-all-errors --max-time 60 -X POST -H "x-cron-secret:${CRON_SECRET}" "${FUNCTIONS_URL}/dispatch-notifications"

  reconciliation:
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '17 2 * * *'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Reconcile financial records
        env:
          FUNCTIONS_URL: ${{ secrets.PRODUCTION_SUPABASE_FUNCTIONS_URL }}
          CRON_SECRET: ${{ secrets.PRODUCTION_CRON_SECRET }}
        run: curl --fail-with-body --retry 3 --retry-all-errors --max-time 60 -X POST -H "x-cron-secret:${CRON_SECRET}" "${FUNCTIONS_URL}/reconcile-financials"

  security-maintenance:
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '43 3 * * *'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Apply privacy retention schedule
        env:
          FUNCTIONS_URL: ${{ secrets.PRODUCTION_SUPABASE_FUNCTIONS_URL }}
          CRON_SECRET: ${{ secrets.PRODUCTION_CRON_SECRET }}
        run: curl --fail-with-body --retry 3 --retry-all-errors --max-time 60 -X POST -H "x-cron-secret:${CRON_SECRET}" -H "x-correlation-id:schedule-${GITHUB_RUN_ID}" "${FUNCTIONS_URL}/security-maintenance"
